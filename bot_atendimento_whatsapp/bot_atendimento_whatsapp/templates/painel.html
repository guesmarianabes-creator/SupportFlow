<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Painel | Atendimento</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    #4338ca,
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 90%,
                    #7c3aed,
                    transparent 30%
                ),
                #0f172a;

            color: white;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        /* =========================
           MENU
        ========================= */

        .sidebar {
            width: 240px;

            background: rgba(15, 23, 42, 0.75);

            border-right:
                1px solid rgba(255,255,255,0.08);

            padding: 30px 20px;

            backdrop-filter: blur(20px);
        }

        .logo {
            font-size: 22px;
            font-weight: bold;

            margin-bottom: 40px;
        }

        .logo span {
            color: #a78bfa;
        }

        .menu {
            display: flex;
            flex-direction: column;

            gap: 10px;
        }

        .menu a {
            text-decoration: none;

            color: #cbd5e1;

            padding: 13px 15px;

            border-radius: 10px;

            transition: 0.2s;
        }

        .menu a:hover,
        .menu .ativo {
            background:
                rgba(139,92,246,0.18);

            color: white;
        }

        /* =========================
           CONTEÚDO
        ========================= */

        .conteudo {
            flex: 1;

            padding: 35px;

            max-width: 1400px;
        }

        .topo {
            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            margin-bottom: 30px;
        }

        .topo h1 {
            font-size: 30px;

            margin-bottom: 7px;
        }

        .topo p {
            color: #cbd5e1;
        }

        .botoes {
            display: flex;
            gap: 10px;
        }

        button {
            font-family: inherit;
        }

        .btn {
            border: none;

            padding: 12px 18px;

            border-radius: 10px;

            cursor: pointer;

            color: white;

            background:
                rgba(255,255,255,0.10);

            transition: 0.2s;
        }

        .btn:hover {
            background:
                rgba(255,255,255,0.18);
        }

        /* =========================
           INDICADORES
        ========================= */

        .indicadores {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 18px;

            margin-bottom: 30px;
        }

        .indicador {
            background:
                rgba(255,255,255,0.09);

            border:
                1px solid rgba(255,255,255,0.10);

            border-radius: 16px;

            padding: 22px;

            backdrop-filter: blur(15px);
        }

        .indicador-topo {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 15px;
        }

        .icone {
            font-size: 25px;
        }

        .indicador-titulo {
            color: #cbd5e1;

            font-size: 14px;
        }

        .numero {
            font-size: 30px;

            font-weight: bold;
        }

        /* =========================
           FILTROS
        ========================= */

        .filtros {
            display: flex;

            gap: 12px;

            margin-bottom: 25px;
        }

        .filtros input {
            flex: 1;

            min-width: 180px;

            padding: 13px 15px;

            border: 1px solid
                rgba(255,255,255,0.10);

            border-radius: 10px;

            outline: none;

            background:
                rgba(255,255,255,0.08);

            color: white;
        }

        .filtros input::placeholder {
            color: #94a3b8;
        }

        /* =========================
           TÍTULO DA LISTA
        ========================= */

        .titulo-lista {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 15px;
        }

        .titulo-lista h2 {
            font-size: 20px;
        }

        .contador {
            color: #94a3b8;

            font-size: 14px;
        }

        /* =========================
           CARDS
        ========================= */

        .lista {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(300px, 1fr));

            gap: 18px;
        }

        .card {
            background:
                rgba(255,255,255,0.09);

            border:
                1px solid rgba(255,255,255,0.10);

            border-radius: 16px;

            padding: 20px;

            backdrop-filter: blur(15px);

            transition: 0.2s;
        }

        .card:hover {
            transform: translateY(-3px);
        }

        .card-topo {
            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            gap: 10px;

            margin-bottom: 20px;
        }

        .nome {
            font-size: 19px;

            font-weight: bold;
        }

        .status {
            background:
                rgba(34,197,94,0.12);

            color: #86efac;

            padding: 5px 9px;

            border-radius: 20px;

            font-size: 11px;
        }

        .info {
            display: flex;

            gap: 10px;

            color: #cbd5e1;

            margin-bottom: 11px;

            font-size: 14px;
        }

        .assunto {
            border-top:
                1px solid rgba(255,255,255,0.08);

            margin-top: 17px;

            padding-top: 17px;

            color: #cbd5e1;

            line-height: 1.5;

            min-height: 65px;
        }

        .assunto strong {
            color: white;

            display: block;

            margin-bottom: 5px;
        }

        .cancelar {
            width: 100%;

            margin-top: 18px;

            padding: 10px;

            border: none;

            border-radius: 9px;

            cursor: pointer;

            color: #fecaca;

            background:
                rgba(239,68,68,0.12);

            transition: 0.2s;
        }

        .cancelar:hover {
            background:
                rgba(239,68,68,0.25);
        }

        /* =========================
           VAZIO
        ========================= */

        .vazio {
            grid-column: 1 / -1;

            text-align: center;

            padding: 60px 20px;

            background:
                rgba(255,255,255,0.07);

            border-radius: 16px;

            color: #cbd5e1;
        }

        .vazio-icon {
            font-size: 45px;

            margin-bottom: 15px;
        }

        /* =========================
           RESPONSIVO
        ========================= */

        @media (max-width: 800px) {

            .sidebar {
                display: none;
            }

            .conteudo {
                padding: 25px 15px;
            }

            .indicadores {
                grid-template-columns: 1fr;
            }

            .topo {
                flex-direction: column;

                align-items: flex-start;
            }

            .botoes {
                width: 100%;
            }

            .btn {
                flex: 1;
            }

            .filtros {
                flex-direction: column;
            }

        }

    </style>

</head>


<body>

<div class="layout">

    <!-- MENU LATERAL -->

    <aside class="sidebar">

        <div class="logo">
            🤖 <span>Atendimento</span>
        </div>

        <nav class="menu">

            <a href="/chat">
                💬 Chat
            </a>

            <a href="/painel"
               class="ativo">
                📅 Agendamentos
            </a>

        </nav>

    </aside>


    <!-- CONTEÚDO -->

    <main class="conteudo">

        <div class="topo">

            <div>

                <h1>
                    Painel de Agendamentos
                </h1>

                <p>
                    Acompanhe e gerencie suas reuniões.
                </p>

            </div>

            <div class="botoes">

                <button
                    class="btn"
                    onclick="carregarReunioes()">

                    🔄 Atualizar

                </button>

            </div>

        </div>


        <!-- INDICADORES -->

        <section class="indicadores">

            <div class="indicador">

                <div class="indicador-topo">

                    <span class="indicador-titulo">
                        Total
                    </span>

                    <span class="icone">
                        📊
                    </span>

                </div>

                <div
                    class="numero"
                    id="total">

                    0

                </div>

            </div>


            <div class="indicador">

                <div class="indicador-topo">

                    <span class="indicador-titulo">
                        Hoje
                    </span>

                    <span class="icone">
                        📅
                    </span>

                </div>

                <div
                    class="numero"
                    id="hoje">

                    0

                </div>

            </div>


            <div class="indicador">

                <div class="indicador-topo">

                    <span class="indicador-titulo">
                        Próximas
                    </span>

                    <span class="icone">
                        ⏭️
                    </span>

                </div>

                <div
                    class="numero"
                    id="proximas">

                    0

                </div>

            </div>

        </section>


        <!-- FILTROS -->

        <div class="filtros">

            <input
                type="text"
                id="busca"
                placeholder="🔎 Buscar por nome ou assunto..."
                oninput="filtrar()"
            >

            <input
                type="date"
                id="dataFiltro"
                onchange="filtrar()"
            >

        </div>


        <!-- TÍTULO -->

        <div class="titulo-lista">

            <h2>
                Reuniões
            </h2>

            <span
                class="contador"
                id="contador">

                0 reuniões

            </span>

        </div>


        <!-- LISTA -->

        <div
            class="lista"
            id="lista">

        </div>

    </main>

</div>


<script>

    let reunioes = [];


    // ========================================================
    // CARREGAR REUNIÕES
    // ========================================================

    async function carregarReunioes() {

        const lista =
            document.getElementById("lista");

        lista.innerHTML = `
            <div class="vazio">
                Carregando agendamentos...
            </div>
        `;

        try {

            const resposta =
                await fetch("/api/reunioes");

            const dados =
                await resposta.json();

            reunioes =
                dados.reunioes || [];

            atualizarIndicadores();

            filtrar();

        } catch (erro) {

            console.error(erro);

            lista.innerHTML = `
                <div class="vazio">

                    <div class="vazio-icon">
                        ⚠️
                    </div>

                    <h2>
                        Erro ao carregar agendamentos
                    </h2>

                </div>
            `;

        }

    }


    // ========================================================
    // INDICADORES
    // ========================================================

    function atualizarIndicadores() {

        const hoje =
            new Date();

        const hojeString =
            hoje.toISOString()
                .split("T")[0];


        const total =
            reunioes.length;


        const reunioesHoje =
            reunioes.filter(
                r => r.data === hojeString
            ).length;


        const futuras =
            reunioes.filter(
                r => {

                    return (
                        r.data > hojeString
                    );

                }
            ).length;


        document.getElementById(
            "total"
        ).textContent = total;


        document.getElementById(
            "hoje"
        ).textContent = reunioesHoje;


        document.getElementById(
            "proximas"
        ).textContent = futuras;

    }


    // ========================================================
    // FILTRAR
    // ========================================================

    function filtrar() {

        const busca =
            document.getElementById(
                "busca"
            ).value
            .toLowerCase()
            .trim();


        const dataFiltro =
            document.getElementById(
                "dataFiltro"
            ).value;


        const resultado =
            reunioes.filter(
                reuniao => {

                    const nome =
                        (reuniao.nome || "")
                        .toLowerCase();


                    const assunto =
                        (reuniao.assunto || "")
                        .toLowerCase();


                    const correspondeBusca =
                        !busca ||
                        nome.includes(busca) ||
                        assunto.includes(busca);


                    const correspondeData =
                        !dataFiltro ||
                        reuniao.data === dataFiltro;


                    return (
                        correspondeBusca &&
                        correspondeData
                    );

                }
            );


        renderizar(resultado);

    }


    // ========================================================
    // MOSTRAR CARDS
    // ========================================================

    function renderizar(listaReunioes) {

        const lista =
            document.getElementById(
                "lista"
            );


        document.getElementById(
            "contador"
        ).textContent =
            `${listaReunioes.length} ${
                listaReunioes.length === 1
                    ? "reunião"
                    : "reuniões"
            }`;


        if (listaReunioes.length === 0) {

            lista.innerHTML = `
                <div class="vazio">

                    <div class="vazio-icon">
                        📅
                    </div>

                    <h2>
                        Nenhuma reunião encontrada
                    </h2>

                    <p style="margin-top:10px;">
                        Tente alterar os filtros.
                    </p>

                </div>
            `;

            return;

        }


        lista.innerHTML =
            listaReunioes
                .map(reuniao => `

                    <div class="card">

                        <div class="card-topo">

                            <div class="nome">
                                👤
                                ${escapar(
                                    reuniao.nome
                                )}
                            </div>

                            <div class="status">
                                AGENDADA
                            </div>

                        </div>


                        <div class="info">
                            📅
                            ${formatarData(
                                reuniao.data
                            )}
                        </div>


                        <div class="info">
                            🕐
                            ${escapar(
                                reuniao.hora
                            )}
                        </div>


                        <div class="assunto">

                            <strong>
                                📝 Assunto
                            </strong>

                            ${escapar(
                                reuniao.assunto
                            )}

                        </div>


                        <button
                            class="cancelar"
                            onclick="cancelar(
                                ${reuniao.id}
                            )">

                            🗑 Cancelar reunião

                        </button>

                    </div>

                `)
                .join("");

    }


    // ========================================================
    // FORMATAR DATA
    // ========================================================

    function formatarData(data) {

        const partes =
            data.split("-");


        if (partes.length !== 3) {

            return data;

        }


        return (
            `${partes[2]}/` +
            `${partes[1]}/` +
            `${partes[0]}`
        );

    }


    // ========================================================
    // SEGURANÇA DO TEXTO
    // ========================================================

    function escapar(texto) {

        const div =
            document.createElement("div");

        div.textContent =
            texto ?? "";

        return div.innerHTML;

    }


    // ========================================================
    // CANCELAR
    // ========================================================

    async function cancelar(id) {

        const confirmar =
            confirm(
                "Tem certeza que deseja cancelar esta reunião?"
            );


        if (!confirmar) {

            return;

        }


        try {

            const resposta =
                await fetch(
                    `/api/reunioes/${id}`,
                    {
                        method: "DELETE"
                    }
                );


            const dados =
                await resposta.json();


            if (!resposta.ok) {

                alert(
                    dados.erro ||
                    "Não foi possível cancelar."
                );

                return;

            }


            alert(
                "Reunião cancelada com sucesso!"
            );


            carregarReunioes();

        }

        catch (erro) {

            console.error(erro);

            alert(
                "Erro ao cancelar a reunião."
            );

        }

    }


    // ========================================================
    // INICIAR
    // ========================================================

    carregarReunioes();

</script>

</body>

</html>
