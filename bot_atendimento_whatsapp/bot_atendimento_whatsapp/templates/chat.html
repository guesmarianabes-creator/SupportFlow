<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Atendimento Virtual</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f5f3ff);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 1000px;
            height: 720px;
            background: white;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(48, 40, 120, 0.18);
            display: flex;
        }

        /* =========================
           MENU LATERAL
        ========================= */

        .sidebar {
            width: 270px;
            background: linear-gradient(180deg, #312e81, #4f46e5);
            color: white;
            padding: 30px 22px;
            display: flex;
            flex-direction: column;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: rgba(255,255,255,0.18);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .logo-text h2 {
            font-size: 18px;
            margin-bottom: 4px;
        }

        .logo-text span {
            font-size: 12px;
            opacity: 0.75;
        }

        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar-button {
            border: none;
            background: transparent;
            color: white;
            padding: 14px;
            border-radius: 12px;
            text-align: left;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
        }

        .sidebar-button:hover {
            background: rgba(255,255,255,0.12);
        }

        .sidebar-button.active {
            background: rgba(255,255,255,0.18);
        }

        .sidebar-footer {
            margin-top: auto;
            font-size: 12px;
            opacity: 0.7;
            text-align: center;
        }

        /* =========================
           CHAT
        ========================= */

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .chat-header {
            height: 80px;
            padding: 0 28px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .bot-avatar {
            width: 46px;
            height: 46px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 22px;
        }

        .chat-title h3 {
            font-size: 16px;
            color: #1f2937;
        }

        .online {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #6b7280;
            margin-top: 3px;
        }

        .online-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
        }

        .panel-button {
            border: none;
            background: #f3f4f6;
            color: #4f46e5;
            padding: 10px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .panel-button:hover {
            background: #e5e7eb;
        }

        /* =========================
           MENSAGENS
        ========================= */

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            background: #fafaff;
        }

        .message {
            display: flex;
            margin-bottom: 18px;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 70%;
            padding: 14px 17px;
            border-radius: 17px;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-line;
        }

        .bot .message-content {
            background: white;
            color: #374151;
            border: 1px solid #e5e7eb;
            border-bottom-left-radius: 5px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.04);
        }

        .user .message-content {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            border-bottom-right-radius: 5px;
        }

        /* =========================
           BOTÕES RÁPIDOS
        ========================= */

        .quick-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 10px;
            max-width: 500px;
        }

        .quick-button {
            background: white;
            border: 1px solid #ddd6fe;
            color: #4338ca;
            padding: 13px;
            border-radius: 12px;
            cursor: pointer;
            text-align: left;
            transition: 0.2s;
            font-size: 13px;
        }

        .quick-button:hover {
            background: #f5f3ff;
            border-color: #8b5cf6;
            transform: translateY(-1px);
        }

        /* =========================
           FORMULÁRIO
        ========================= */

        .agenda-box {
            display: none;
            background: white;
            border: 1px solid #ddd6fe;
            border-radius: 18px;
            padding: 20px;
            margin-top: 12px;
            max-width: 520px;
            box-shadow: 0 8px 25px rgba(79, 70, 229, 0.08);
        }

        .agenda-title {
            font-size: 17px;
            font-weight: bold;
            color: #312e81;
            margin-bottom: 5px;
        }

        .agenda-subtitle {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 18px;
        }

        .form-group {
            margin-bottom: 13px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            color: #374151;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            padding: 11px 12px;
            outline: none;
            font-size: 13px;
            transition: 0.2s;
        }

        .form-group input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99,102,241,0.10);
        }

        .form-buttons {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        .confirm-button {
            flex: 1;
            border: none;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .cancel-button {
            border: 1px solid #d1d5db;
            background: white;
            color: #6b7280;
            padding: 12px 16px;
            border-radius: 10px;
            cursor: pointer;
        }

        .confirm-button:hover {
            opacity: 0.9;
        }

        .cancel-button:hover {
            background: #f9fafb;
        }

        .agenda-error {
            display: none;
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
            padding: 10px;
            border-radius: 9px;
            font-size: 12px;
            margin-top: 12px;
        }

        /* =========================
           DIGITANDO
        ========================= */

        .typing {
            display: none;
            margin-bottom: 15px;
        }

        .typing-box {
            background: white;
            border: 1px solid #e5e7eb;
            display: inline-flex;
            gap: 4px;
            padding: 12px 15px;
            border-radius: 15px;
        }

        .typing-box span {
            width: 6px;
            height: 6px;
            background: #8b5cf6;
            border-radius: 50%;
            animation: typing 1.2s infinite;
        }

        .typing-box span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-box span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {

            0%, 60%, 100% {
                transform: translateY(0);
            }

            30% {
                transform: translateY(-5px);
            }
        }

        /* =========================
           INPUT
        ========================= */

        .input-area {
            padding: 18px 24px;
            background: white;
            border-top: 1px solid #eee;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            background: #f5f5f7;
            border-radius: 14px;
            padding: 6px;
        }

        #messageInput {
            flex: 1;
            border: none;
            background: transparent;
            outline: none;
            padding: 10px 12px;
            font-size: 14px;
        }

        #sendButton {
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 11px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            cursor: pointer;
            font-size: 18px;
            transition: 0.2s;
        }

        #sendButton:hover {
            transform: scale(1.05);
        }

        #sendButton:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* =========================
           RESPONSIVO
        ========================= */

        @media (max-width: 700px) {

            body {
                padding: 0;
            }

            .chat-container {
                height: 100vh;
                border-radius: 0;
            }

            .sidebar {
                display: none;
            }

            .chat-header {
                padding: 0 16px;
            }

            .messages {
                padding: 20px 15px;
            }

            .message-content {
                max-width: 85%;
            }

            .quick-options {
                grid-template-columns: 1fr;
            }

            .panel-button {
                display: none;
            }

            .agenda-box {
                max-width: 100%;
            }
        }

    </style>

</head>

<body>

<div class="chat-container">

    <!-- =========================
         MENU LATERAL
    ========================= -->

    <aside class="sidebar">

        <div class="logo">

            <div class="logo-icon">
                🤖
            </div>

            <div class="logo-text">
                <h2>Atendimento</h2>
                <span>Assistente Virtual</span>
            </div>

        </div>

        <div class="sidebar-menu">

            <button
                class="sidebar-button active"
                onclick="mostrarMenu()"
            >
                💬 Atendimento
            </button>

            <button
                class="sidebar-button"
                onclick="abrirPainel()"
            >
                📅 Agendamentos
            </button>

        </div>

        <div class="sidebar-footer">
            Sistema de Atendimento
        </div>

    </aside>


    <!-- =========================
         CHAT
    ========================= -->

    <main class="chat-area">

        <header class="chat-header">

            <div class="chat-title">

                <div class="bot-avatar">
                    🤖
                </div>

                <div>

                    <h3>Assistente Virtual</h3>

                    <div class="online">
                        <span class="online-dot"></span>
                        Online
                    </div>

                </div>

            </div>

            <button
                class="panel-button"
                onclick="abrirPainel()"
            >
                📅 Painel
            </button>

        </header>


        <!-- =========================
             ÁREA DE MENSAGENS
        ========================= -->

        <section
            class="messages"
            id="messages"
        >

            <div class="message bot">

                <div class="message-content">
                    Olá! 👋

                    Seja bem-vindo(a) ao nosso atendimento.

                    Sou o assistente virtual e estou aqui para ajudar você.

                    Como posso ajudar?
                </div>

            </div>


            <!-- OPÇÕES -->

            <div
                class="quick-options"
                id="quickOptions"
            >

                <button
                    class="quick-button"
                    onclick="enviarOpcao('horário')"
                >
                    🕐 Horário de atendimento
                </button>

                <button
                    class="quick-button"
                    onclick="enviarOpcao('serviços')"
                >
                    💼 Nossos serviços
                </button>

                <button
                    class="quick-button"
                    onclick="enviarOpcao('endereço')"
                >
                    📍 Nosso endereço
                </button>

                <button
                    class="quick-button"
                    onclick="mostrarFormularioAgendamento()"
                >
                    📅 Agendar reunião
                </button>

            </div>


            <!-- =========================
                 FORMULÁRIO DE AGENDAMENTO
            ========================= -->

            <div
                class="agenda-box"
                id="agendaBox"
            >

                <div class="agenda-title">
                    📅 Agendar reunião
                </div>

                <div class="agenda-subtitle">
                    Preencha os dados abaixo para solicitar seu agendamento.
                </div>


                <div class="form-group">

                    <label for="nome">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="nome"
                        placeholder="Digite seu nome"
                    >

                </div>


                <div class="form-group">

                    <label for="data">
                        Data
                    </label>

                    <input
                        type="date"
                        id="data"
                    >

                </div>


                <div class="form-group">

                    <label for="hora">
                        Horário
                    </label>

                    <input
                        type="time"
                        id="hora"
                        min="08:00"
                        max="17:59"
                    >

                </div>


                <div class="form-group">

                    <label for="assunto">
                        Assunto da reunião
                    </label>

                    <input
                        type="text"
                        id="assunto"
                        placeholder="Ex.: Reunião pedagógica"
                    >

                </div>


                <div
                    class="agenda-error"
                    id="agendaError"
                ></div>


                <div class="form-buttons">

                    <button
                        class="cancel-button"
                        onclick="fecharFormularioAgendamento()"
                    >
                        Cancelar
                    </button>

                    <button
                        class="confirm-button"
                        onclick="confirmarAgendamento()"
                    >
                        Confirmar agendamento
                    </button>

                </div>

            </div>


            <!-- DIGITANDO -->

            <div
                class="typing"
                id="typing"
            >

                <div class="typing-box">

                    <span></span>
                    <span></span>
                    <span></span>

                </div>

            </div>

        </section>


        <!-- =========================
             CAMPO DE MENSAGEM
        ========================= -->

        <footer class="input-area">

            <div class="input-wrapper">

                <input
                    type="text"
                    id="messageInput"
                    placeholder="Digite sua mensagem..."
                    autocomplete="off"
                >

                <button
                    id="sendButton"
                    onclick="enviarMensagem()"
                >
                    ➤
                </button>

            </div>

        </footer>

    </main>

</div>


<script>

    const messages =
        document.getElementById("messages");

    const input =
        document.getElementById("messageInput");

    const sendButton =
        document.getElementById("sendButton");

    const typing =
        document.getElementById("typing");


    /* =========================
       ADICIONAR MENSAGEM
    ========================= */

    function adicionarMensagem(texto, tipo) {

        const message =
            document.createElement("div");

        message.className =
            "message " + tipo;

        const content =
            document.createElement("div");

        content.className =
            "message-content";

        content.textContent =
            texto;

        message.appendChild(content);

        messages.insertBefore(
            message,
            typing
        );

        messages.scrollTop =
            messages.scrollHeight;
    }


    /* =========================
       DIGITANDO
    ========================= */

    function mostrarDigitando() {

        typing.style.display = "block";

        messages.scrollTop =
            messages.scrollHeight;
    }


    function esconderDigitando() {

        typing.style.display = "none";
    }


    /* =========================
       ENVIAR MENSAGEM
    ========================= */

    async function enviarMensagem(texto = null) {

        const
